name: Embedded PM Daily

on:
  # 定时:北京时间 早 8 点(UTC 0 点)
  schedule:
    - cron: "0 0 * * *"
  # 允许手动触发
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "抓取多少小时内文章(默认 24)"
        required: false
        default: "24"
      debug:
        description: "调试模式(执行诊断步骤,可能烧 token,默认 false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 允许 Commit seen.json 步骤 push 回仓库

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ====== LLM 连通性测试(日常 cron 必跑,失败则中止整个 job)======
      # 这是推送前的硬性前置:不让坏 LLM 配进到主流程里空转+token 浪费
      - name: LLM 连通性测试
        id: llm_check
        env:
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          echo "测试 LLM 连通性: ${LLM_MODEL}"
          # 只 echo 长度+前 4 位哈希,不泄露 key 明文
          KEY_PREFIX=$(printf '%s' "${LLM_API_KEY}" | cut -c1-4)
          echo "API_KEY 前缀(哈希安全): ${KEY_PREFIX}***"
          echo ""
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "${LLM_API_BASE}/chat/completions" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${LLM_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"说hi\"}],\"max_tokens\":20}" \
            --max-time 30)
          HTTP_CODE=$(echo "${RESP}" | tail -n1)
          BODY=$(echo "${RESP}" | head -n-1)
          echo "HTTP 状态: ${HTTP_CODE}"
          echo "响应体: ${BODY}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "❌ LLM 连通性测试失败,中止整个 job"
            exit 1
          fi
          # 校验响应里含 'content' 字段(说明能拿到正文,不是错误页)
          if ! echo "${BODY}" | grep -q '"content"'; then
            echo "❌ 响应不包含 content 字段,LLM 模型名可能不对或服务端不兼容"
            exit 1
          fi
          echo "✅ LLM 连通性测试通过"

      # ====== 主流程(LLM 通才走)======
      - name: Run daily push
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
        run: |
          python -m src.main

      - name: Commit seen.json
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --cached --quiet; then
            echo "seen.json 无变化,跳过提交"
          else
            git commit -m "chore: update seen.json $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

      # ====== 调试步骤:只在手动 Run workflow 时跑,日常 cron 不跑 ======
      - name: 调试 - DNS / 网络诊断(仅 debug)
        if: ${{ github.event.inputs.debug == 'true' }}
        env:
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: |
          BASE="${LLM_API_BASE}"
          if [[ "${BASE}" =~ ^(https?://[^/]+)(/.*)?$ ]]; then
            ORIGIN="${BASH_REMATCH[1]}"
          else
            ORIGIN="${BASE}"
          fi
          HOST="${ORIGIN#https://}"
          HOST="${HOST#http://}"
          echo "DNS 解析 ${HOST}:"
          nslookup "${HOST}" 2>&1 | tail -8
          echo "出口 IP:"
          curl -s --max-time 10 ifconfig.me || echo "(获取失败)"

      - name: 调试 - DeepSeek 备选连通(仅 debug)
        if: ${{ github.event.inputs.debug == 'true' }}
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: |
          if [ -z "${DEEPSEEK_KEY}" ]; then
            echo "未配置 DEEPSEEK_KEY,跳过 DeepSeek 测试"
          else
            echo "--- DeepSeek 备选测试 ---"
            curl -sS -w "\nHTTP_CODE: %{http_code}\nTIME: %{time_total}s\n" \
              -X POST "https://api.deepseek.com/v1/chat/completions" \
              -H "Authorization: Bearer ${DEEPSEEK_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"说hi"}],"max_tokens":20}' \
              --max-time 30
          fi
        continue-on-error: true