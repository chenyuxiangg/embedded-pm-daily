name: Embedded PM Daily

on:
  # 定时:北京时间 早 8 点(UTC 0 点)
  schedule:
    - cron: "0 0 * * *"
  # 允许手动触发
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "抓取多少小时内文章(默认 24)"
        required: false
        default: "24"
      max_per_source:
        description: "每个源最多取多少篇(默认 8,设小可减少 token 消耗)"
        required: false
        default: "8"
      llm_max_articles:
        description: "单次最多摘要多少篇(防爆 token,默认 80)"
        required: false
        default: "80"
      debug:
        description: "调试模式(执行诊断步骤,可能烧 token,默认 false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# ====== 仓库级变量(去仓库 Settings → Variables → Actions 添加)======
# STATE_REPO_OWNER: state 仓的所有者用户名
# STATE_REPO_NAME: state 仓的仓库名

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ====== LLM 连通性测试(日常 cron 必跑,失败则中止整个 job)======
      # 这是推送前的硬性前置:不让坏 LLM 配进到主流程里空转+token 浪费
      - name: LLM 连通性测试
        id: llm_check
        env:
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          echo "测试 LLM 连通性: ${LLM_MODEL}"
          # 只 echo 长度+前 4 位哈希,不泄露 key 明文
          KEY_PREFIX=$(printf '%s' "${LLM_API_KEY}" | cut -c1-4)
          echo "API_KEY 前缀(哈希安全): ${KEY_PREFIX}***"
          echo ""
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "${LLM_API_BASE}/chat/completions" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${LLM_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"说hi\"}],\"max_tokens\":20}" \
            --max-time 30)
          HTTP_CODE=$(echo "${RESP}" | tail -n1)
          BODY=$(echo "${RESP}" | head -n-1)
          echo "HTTP 状态: ${HTTP_CODE}"
          echo "响应体: ${BODY}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "❌ LLM 连通性测试失败,中止整个 job"
            exit 1
          fi
          # 校验响应里含 'content' 字段(说明能拿到正文,不是错误页)
          if ! echo "${BODY}" | grep -q '"content"'; then
            echo "❌ 响应不包含 content 字段,LLM 模型名可能不对或服务端不兼容"
            exit 1
          fi
          echo "✅ LLM 连通性测试通过"

      # ====== 主流程(LLM 通才走)======
      - name: Download seen.json from state repo
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
          STATE_REPO_OWNER: ${{ vars.STATE_REPO_OWNER }}
          STATE_REPO_NAME: ${{ vars.STATE_REPO_NAME }}
        run: |
          if [ -z "${STATE_REPO_TOKEN}" ]; then
            echo "⚠️ STATE_REPO_TOKEN 未配置,跳过下载(首次运行或未启用跨 run 去重)"
            exit 0
          fi
          # 在临时目录单独 clone state 仓(避免污染主 checkout 的 git 历史)
          TMP=$(mktemp -d)
          cd "$TMP"
          git init -q -b main
          git remote add origin "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${STATE_REPO_OWNER}/${STATE_REPO_NAME}.git"
          # 确保 data/ 目录存在
          mkdir -p "${GITHUB_WORKSPACE}/data"
          # 拉 main 分支的 seen.json,容忍首次(远端空仓/文件不存在)
          if git fetch --depth=1 origin main 2>/dev/null; then
            # 用 git show ... | cat 而不是 > 重定向,避免覆盖写空
            if CONTENT=$(git show origin/main:seen.json 2>/dev/null); then
              printf '%s' "$CONTENT" > "${GITHUB_WORKSPACE}/data/seen.json"
              echo "✅ 已下载 seen.json ($(wc -c < "${GITHUB_WORKSPACE}/data/seen.json") 字节)"
            else
              echo "首次拉取,远端无 seen.json(视为空去重状态)"
              # 关键:不能 touch 一个空文件,会让 DedupStore 读空 dict 当作"没历史"
              rm -f "${GITHUB_WORKSPACE}/data/seen.json"
            fi
          else
            echo "首次拉取,远端空仓(视为空去重状态)"
            # 同样不能留空文件 - 删掉让 DedupStore 走"无历史文件"路径
            rm -f "${GITHUB_WORKSPACE}/data/seen.json"
          fi
          # 切回主 checkout 继续后续步骤
          cd "${GITHUB_WORKSPACE}"
          ls -la data/seen.json 2>/dev/null || echo "data/seen.json 不存在(本次 run 无跨 run 去重)"

      - name: Run daily push
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
          MAX_PER_SOURCE: ${{ github.event.inputs.max_per_source || '8' }}
          LLM_MAX_ARTICLES: ${{ github.event.inputs.llm_max_articles || '80' }}
        run: |
          python -m src.main

      # ====== 上传 seen.json 到独立 state 仓(跨 run 去重)======
      - name: Upload seen.json to state repo
        if: success()
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
          STATE_REPO_OWNER: ${{ vars.STATE_REPO_OWNER }}
          STATE_REPO_NAME: ${{ vars.STATE_REPO_NAME }}
        run: |
          if [ -z "${STATE_REPO_TOKEN}" ]; then
            echo "⚠️ STATE_REPO_TOKEN 未配置,跳过上传(本次 seen.json 不会跨 run 共享)"
            exit 0
          fi
          if [ ! -f "${GITHUB_WORKSPACE}/data/seen.json" ]; then
            echo "⚠️ data/seen.json 不存在(主流程可能没产生),跳过上传"
            exit 0
          fi
          # 在临时目录 clone state 仓 + 替换 seen.json + commit + push
          TMP=$(mktemp -d)
          cd "$TMP"
          git init -q -b main
          git remote add origin "https://x-access-token:${STATE_REPO_TOKEN}@github.com/${STATE_REPO_OWNER}/${STATE_REPO_NAME}.git"
          git fetch --depth=1 origin main 2>/dev/null || echo "首次上传,远端空仓"
          git checkout -b main origin/main 2>/dev/null || git checkout --orphan main
          # 从主 checkout 拷 seen.json 到临时仓
          cp "${GITHUB_WORKSPACE}/data/seen.json" ./seen.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "seen.json 无变化,跳过 push"
          else
            git commit -m "chore: update seen.json $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin main
            echo "✅ seen.json 已上传到 state repo"
          fi

      # ====== 调试步骤:只在手动 Run workflow 时跑,日常 cron 不跑 ======
      - name: 调试 - DNS / 网络诊断(仅 debug)
        if: ${{ github.event.inputs.debug == 'true' }}
        env:
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: |
          BASE="${LLM_API_BASE}"
          if [[ "${BASE}" =~ ^(https?://[^/]+)(/.*)?$ ]]; then
            ORIGIN="${BASH_REMATCH[1]}"
          else
            ORIGIN="${BASE}"
          fi
          HOST="${ORIGIN#https://}"
          HOST="${HOST#http://}"
          echo "DNS 解析 ${HOST}:"
          nslookup "${HOST}" 2>&1 | tail -8
          echo "出口 IP:"
          curl -s --max-time 10 ifconfig.me || echo "(获取失败)"

      - name: 调试 - DeepSeek 备选连通(仅 debug)
        if: ${{ github.event.inputs.debug == 'true' }}
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: |
          if [ -z "${DEEPSEEK_KEY}" ]; then
            echo "未配置 DEEPSEEK_KEY,跳过 DeepSeek 测试"
          else
            echo "--- DeepSeek 备选测试 ---"
            curl -sS -w "\nHTTP_CODE: %{http_code}\nTIME: %{time_total}s\n" \
              -X POST "https://api.deepseek.com/v1/chat/completions" \
              -H "Authorization: Bearer ${DEEPSEEK_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"说hi"}],"max_tokens":20}' \
              --max-time 30
          fi
        continue-on-error: true