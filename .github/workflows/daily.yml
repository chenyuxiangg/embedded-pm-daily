name: Embedded PM Daily

on:
  # 定时:北京时间 早 8 点(UTC 0 点)
  schedule:
    - cron: "0 0 * * *"
  # 允许手动触发
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "抓取多少小时内文章(默认 24)"
        required: false
        default: "24"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ====== 调试:真实诊断 ======
      - name: 调试 - 完整诊断
        env:
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          echo "========== 1. 真实配置(base64 编码避开 mask)=========="
          # 把 secret 写入文件,绕过日志 mask
          printf '%s' "${LLM_API_BASE}" > /tmp/.b
          printf '%s' "${LLM_MODEL}" > /tmp/.m
          printf '%s' "${LLM_API_KEY:0:12}" > /tmp/.k
          ls -la /tmp/.b /tmp/.m /tmp/.k
          echo ""
          echo "Base64 编码(把这段贴出来,我帮你解码):"
          echo "  LLM_API_BASE b64: $(base64 -w0 /tmp/.b)"
          echo "  LLM_MODEL    b64: $(base64 -w0 /tmp/.m)"
          echo "  LLM_API_KEY prefix: $(cat /tmp/.k)"
          echo ""
          # 清理敏感文件
          shred -u /tmp/.b /tmp/.m /tmp/.k 2>/dev/null || rm -f /tmp/.b /tmp/.m /tmp/.k

          echo "========== 2. URL 解析(host 只解主机名部分)=========="
          # 提取协议 + 主机名(去掉路径)
          BASE="${LLM_API_BASE}"
          if [[ "${BASE}" =~ ^(https?://[^/]+)(/.*)?$ ]]; then
            ORIGIN="${BASH_REMATCH[1]}"
            PATH_PART="${BASH_REMATCH[2]}"
          else
            ORIGIN="${BASE}"
            PATH_PART=""
          fi
          echo "Origin(主机): ${ORIGIN}"
          echo "Path(挂载): ${PATH_PART}"
          echo ""
          echo "DNS 解析 ${ORIGIN#https://}:"
          HOST="${ORIGIN#https://}"
          HOST="${HOST#http://}"
          nslookup "${HOST}" 2>&1 | tail -8
          echo ""
          echo "Ping ${HOST}:"
          ping -c 2 -W 2 "${HOST}" 2>&1 | head -8
          echo ""
          echo "出口 IP:"
          curl -s --max-time 10 ifconfig.me || echo "(获取失败)"
          echo ""

      - name: 调试 - curl LLM
        env:
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          echo "========== 3. 实际 curl 测试 =========="
          echo "请求 URL: ${LLM_API_BASE}/chat/completions"
          echo "请求体: {\"model\":\"${LLM_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"说hi\"}],\"max_tokens\":20}"
          echo ""
          echo "--- 测试 1: 当前配置的模型 ---"
          curl -sS -w "\n\nHTTP_CODE: %{http_code}\nTIME: %{time_total}s\n" \
            -X POST "${LLM_API_BASE}/chat/completions" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${LLM_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"说hi\"}],\"max_tokens\":20}" \
            --max-time 30
          echo ""
          echo "--- 测试 2: 强制用 MiniMax-M2 ---"
          curl -sS -w "\n\nHTTP_CODE: %{http_code}\nTIME: %{time_total}s\n" \
            -X POST "${LLM_API_BASE}/chat/completions" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"model":"MiniMax-M2","messages":[{"role":"user","content":"说hi"}],"max_tokens":20}' \
            --max-time 30
        continue-on-error: true

      - name: 调试 - 测试 DeepSeek 备选
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: |
          if [ -z "${DEEPSEEK_KEY}" ]; then
            echo "未配置 DEEPSEEK_KEY,跳过 DeepSeek 测试"
          else
            echo "--- DeepSeek 备选测试 ---"
            curl -sS -w "\nHTTP_CODE: %{http_code}\nTIME: %{time_total}s\n" \
              -X POST "https://api.deepseek.com/v1/chat/completions" \
              -H "Authorization: Bearer ${DEEPSEEK_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"说hi"}],"max_tokens":20}' \
              --max-time 30
          fi
        continue-on-error: true

      # ====== 主流程 ======
      - name: Run daily push
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
        run: |
          python -m src.main

      - name: Commit seen.json
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --cached --quiet; then
            echo "seen.json 无变化,跳过提交"
          else
            git commit -m "chore: update seen.json $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi